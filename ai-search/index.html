<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Search</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-md">
        <h1 class="text-xl font-bold text-center mb-4">What do you want to find?</h1>
        
        <!-- Search Bar Form (Added id="searchForm") -->
        <form id="searchForm" class="flex gap-2">
            <input 
                id="queryInput"
                type="text" 
                placeholder="Type anything here..." 
                class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <button type="submit" class="bg-blue-600 text-white px-5 rounded-xl font-medium">Search</button>
        </form>

        <!-- Where search results will appear -->
        <div id="resultContainer" class="mt-4"></div>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
