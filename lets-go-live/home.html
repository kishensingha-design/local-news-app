<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Live - Discover Live Streams & Rooms</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f13] min-h-screen text-slate-100 font-sans pb-24">
    <header class="bg-[#1a1a24] sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-md">
        <span class="text-base font-black tracking-wider bg-gradient-to-r from-[#7928ca] to-[#ff2a5f] bg-clip-text text-transparent">Let's Live</span>
        <a href="wallet.html" class="bg-pink-500/10 border border-pink-500/20 text-pink-400 text-xs px-3 py-1.5 rounded-full font-bold">💳 Wallet</a>
    </header>
    <div class="p-4 max-w-md mx-auto space-y-4">
        <div id="content-container" class="grid grid-cols-2 gap-3 pt-2">
            <a href="room.html" class="bg-[#1a1a24] rounded-2xl overflow-hidden border border-slate-800 group hover:border-[#ff2a5f] transition-all">
                <div class="relative h-40 bg-slate-800 flex items-center justify-center">
                    <span class="absolute top-2 left-2 bg-[#ff2a5f] text-white text-[9px] font-black px-2 py-0.5 rounded uppercase">LIVE</span>
                    <div class="absolute bottom-2 left-2 text-[11px] font-semibold text-white">Priya Live Show</div>
                </div>
                <div class="p-2.5">
                    <h6 class="text-xs font-bold text-white truncate">Priya Sharma</h6>
                    <p class="text-[10px] text-slate-400">Music & Chill</p>
                </div>
            </a>
        </div>
    </div>
    <!-- Bottom Navigation Bar with Center Plus Button -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1a1a24] border-t border-slate-800 py-2.5 px-6 flex justify-between items-center z-50 text-xs text-slate-400">
        <a href="home.html" class="text-pink-500 font-bold flex flex-col items-center gap-0.5">🏠 Home</a>
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400">🧭 Explore</a>
        
        <!-- Center Plus 'Go Live' Broadcast Button -->
        <a href="go-live.html" class="relative -top-3 bg-gradient-to-tr from-[#7928ca] to-[#ff2a5f] text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-xl font-black border-4 border-[#0f0f13] hover:scale-105 transition-all">
            +
        </a>

        <a href="message.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400">💬 Messages</a>
        <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400">👤 Profile</a>
    </nav>
</body>
</html>
