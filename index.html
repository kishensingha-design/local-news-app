<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalNews India - Hyper-Local & Schemes</title>
    <!-- Tailwind CSS for mobile UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Firestore CDNs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans pb-10">

    <!-- App Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-lg font-bold text-center">📰 LocalNews India</h1>
        <p class="text-xs text-center text-blue-100">Schemes, Jobs & Local Updates</p>
    </header>

    <!-- Main Container -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        
        <!-- Location Selector Card -->
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h2 class="text-xs font-bold text-gray-600 uppercase">Select Your Location</h2>
            
            <!-- State Dropdown -->
            <div>
                <label class="block text-[11px] text-gray-500 mb-1">State / UT</label>
                <select id="stateSelect" onchange="populateDistricts()" class="w-full p-2.5 border rounded-lg bg-gray-50 text-sm font-medium">
                    <option value="">-- Choose State --</option>
                </select>
            </div>

            <!-- District Dropdown -->
            <div>
                <label class="block text-[11px] text-gray-500 mb-1">District / City</label>
                <select id="districtSelect" onchange="filterNews()" class="w-full p-2.5 border rounded-lg bg-gray-50 text-sm font-medium">
                    <option value="">-- Choose State First --</option>
                </select>
            </div>
        </div>

        <!-- News Feed Section -->
        <section>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Nearby Updates</h2>
                <span id="feedStatus" class="text-xs text-blue-600 font-semibold">Select Location</span>
            </div>
            
            <div id="newsContainer" class="space-y-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center py-8">
                    <p class="text-xs text-gray-500">Please select your State and District above to load live local news and government schemes.</p>
                </div>
            </div>
        </section>

        <!-- Feedback Box -->
        <section class="bg-white p-4 rounded-xl shadow-sm mt-6 border border-gray-100">
            <h2 class="text-sm font-bold text-gray-800 mb-1">💡 Suggest a Feature or City</h2>
            <p class="text-xs text-gray-500 mb-3">Send your feedback directly to our database.</p>
            <textarea id="feedbackInput" placeholder="Type your idea or feedback in your mother tongue..." class="w-full p-3 border rounded-lg text-xs h-20 mb-3 bg-gray-50"></textarea>
            <button onclick="submitFeedback()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-xs font-bold shadow hover:bg-blue-700 transition">
                Submit Feedback
            </button>
        </section>

    </main>

    <!-- Application Script -->
    <script>
        // Optional: Replace these with your actual Firebase configuration keys when ready
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase safely
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) {
            console.log("Firebase config pending.");
        }
        const db = firebase.apps.length ? firebase.firestore() : null;

        // Clean, non-mixing Indian States and Districts Dataset
        const indiaRegions = {
            "Bihar": ["Patna", "Gaya", "Muzaffarpur", "Bhagalpur", "Purnia", "Darbhanga", "Begusarai", "Nalanda", "Bhojpur", "Siwan"],
            "Uttar Pradesh": ["Lucknow", "Kanpur", "Varanasi", "Agra", "Prayagraj", "Meerut", "Ghaziabad", "Noida", "Bareilly", "Gorakhpur"],
            "Maharashtra": ["Mumbai City", "Mumbai Suburban", "Pune", "Nagpur", "Thane", "Nashik", "Aurangabad", "Solapur", "Kolhapur"],
            "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Ajmer", "Bikaner", "Alwar", "Bhilwara", "Sikar"],
            "Delhi (NCT)": ["Central Delhi", "New Delhi", "North Delhi", "South Delhi", "West Delhi", "East Delhi"],
            "West Bengal": ["Kolkata", "Howrah", "Darjeeling", "Asansol", "Siliguri", "Durgapur"],
            "Karnataka": ["Bengaluru Urban", "Mysuru", "Mangaluru", "Hubballi-Dharwad", "Belagavi", "Kalaburagi"],
            "Madhya Pradesh": ["Bhopal", "Indore", "Gwalior", "Jabalpur", "Ujjain", "Sagar"],
            "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar", "Jamnagar"],
            "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem", "Tirunelveli"]
        };

        // Load States on Startup
        window.onload = function() {
            let stateSelect = document.getElementById("stateSelect");
            for (let state in indiaRegions) {
                let opt = document.createElement("option");
                opt.value = state;
                opt.innerHTML = state;
                stateSelect.appendChild(opt);
            }
        };

        // Populate Districts cleanly when State changes
        function populateDistricts() {
            let state = document.getElementById("stateSelect").value;
            let districtSelect = document.getElementById("districtSelect");
            
            districtSelect.innerHTML = '<option value="">-- Choose District / City --</option>';

            if (state && indiaRegions[state]) {
                indiaRegions[state].forEach(district => {
                    let opt = document.createElement("option");
                    opt.value = district;
                    opt.innerHTML = district;
                    districtSelect.appendChild(opt);
                });
            }
        }

        // Fetch and Display News Cards dynamically based on selected district
        function filterNews() {
            let district = document.getElementById("districtSelect").value;
            let container = document.getElementById("newsContainer");
            let status = document.getElementById("feedStatus");

            if (!district) return;

            status.innerHTML = `Loading ${district}...`;
            container.innerHTML = `<p class="text-xs text-center text-gray-400 py-4">Fetching live updates for ${district}...</p>`;

            // If Firebase is not configured yet, show a rich sample news card
            if (!db || firebaseConfig.apiKey === "YOUR_API_KEY") {
                container.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold uppercase">Govt Scheme</span>
                            <span class="text-xs text-gray-400">Just now</span>
                        </div>
                        <h3 class="font-bold text-base text-gray-800">New Housing Subsidy Announced in ${district}</h3>
                        <p class="text-xs text-gray-600 leading-relaxed">Full details: Eligible residents can now apply for financial aid under the latest state welfare program...</p>
                        
                        <!-- Video Highlight Link if available -->
                        <div class="bg-gray-50 p-2 rounded-lg flex items-center justify-between text-xs">
                            <span class="text-gray-700 font-medium truncate">▶️ Watch Video Highlight</span>
                            <a href="https://youtube.com" target="_blank" class="text-blue-600 font-bold shrink-0">Open Link</a>
                        </div>

                        <div class="pt-2 border-t flex justify-between items-center text-xs">
                            <span class="text-gray-500 font-medium">📍 ${district}</span>
                            <button onclick="shareNews('New Housing Subsidy in ${district}', '${district}')" class="text-blue-600 font-bold flex items-center gap-1">
                                🔗 Share News
                            </button>
                        </div>
                    </div>`;
                status.innerHTML = `Live Feed (${district})`;
                return;
            }

            // Real Firebase Query
            db.collection("news")
              .where("city", "==", district)
              .get()
              .then((querySnapshot) => {
                  container.innerHTML = "";
                  if (querySnapshot.empty) {
                      container.innerHTML = `
                          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center py-6">
                              <p class="text-xs font-bold text-gray-700">No live news found for ${district} yet.</p>
                              <p class="text-[11px] text-gray-400 mt-1">Our automated pipeline will update this region shortly.</p>
                          </div>`;
                  } else {
                      querySnapshot.forEach((doc) => {
                          let news = doc.data();
                          container.innerHTML += `
                              <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-2">
                                  <div class="flex justify-between items-center">
                                      <span class="text-[10px] bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold uppercase">${news.category || 'Update'}</span>
                                      <span class="text-xs text-gray-400">Recent</span>
                                  </div>
                                  <h3 class="font-bold text-base text-gray-800">${news.title}</h3>
                                  <p class="text-xs text-gray-600 leading-relaxed">${news.description}</p>
                                  
                                  ${news.video_url ? `
                                  <div class="bg-gray-50 p-2 rounded-lg flex items-center justify-between text-xs">
                                      <span class="text-gray-700 font-medium">▶️ Watch Video</span>
                                      <a href="${news.video_url}" target="_blank" class="text-blue-600 font-bold">Open</a>
                                  </div>` : ''}

                                  <div class="pt-2 border-t flex justify-between items-center text-xs">
                                      <span class="text-gray-500 font-medium">📍 ${news.city}</span>
                                      <button onclick="shareNews('${news.title}', '${news.city}')" class="text-blue-600 font-bold">🔗 Share</button>
                                  </div>
                              </div>`;
                      });
                  }
                  status.innerHTML = `Live Feed (${district})`;
              })
              .catch(() => {
                  container.innerHTML = `<p class="text-xs text-red-500 text-center">Error loading news feed.</p>`;
              });
        }

        // Instant Share Function (Copies link & text for WhatsApp)
        function shareNews(title, city) {
            let shareText = `📰 *${title}*\n📍 Region: ${city}\n\nRead full details and get live updates on LocalNews India app.`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => {
                    alert("🔗 News link & text copied! Paste it directly into WhatsApp to share with your dear ones.");
                });
            } else {
                alert("Share: " + shareText);
            }
        }

        // Submit Feedback (Foolproof version)
        function submitFeedback() {
            let text = document.getElementById("feedbackInput").value;
            let district = document.getElementById("districtSelect").value || "General";

            if (!text.trim()) {
                alert("Please write your feedback before submitting.");
                return;
            }

            if (!db || firebaseConfig.apiKey === "YOUR_API_KEY") {
                alert("⚠️ Feedback received locally (Connect Firebase keys later): " + text);
                document.getElementById("feedbackInput").value = "";
                return;
            }

            db.collection("feedback").add({
                feedback_text: text,
                city: district,
                created_at: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("✅ Thank you! Your feedback has been successfully sent to Firebase.");
                document.getElementById("feedbackInput").value = "";
            })
            .catch((error) => {
                console.error("Firebase error: ", error);
                alert("❌ Error sending feedback. Check your network connection.");
            });
        }
    </script>
</body>
</html>
