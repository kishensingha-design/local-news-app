<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Live - User Profile & Wallet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        livePink: '#ff2a5f',
                        livePurple: '#7928ca',
                        darkBg: '#0f0f13',
                        cardBg: '#1a1a24'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg min-h-screen text-slate-100 font-sans pb-20">

    <!-- Top Header -->
    <header class="bg-cardBg sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-md">
        <div class="flex items-center gap-2">
            <a href="home.html" class="text-slate-400 hover:text-white text-sm">← Back</a>
            <span class="text-sm font-bold tracking-wider">My Profile</span>
        </div>
        <a href="index.html" class="text-red-400 hover:text-red-300 text-xs font-bold bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">Logout</a>
    </header>

    <!-- Profile Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- User Info Card -->
        <div class="bg-cardBg p-5 rounded-2xl border border-slate-800 text-center space-y-3 relative overflow-hidden shadow-xl">
            <div class="absolute inset-x-0 top-0 h-16 bg-gradient-to-r from-livePurple to-livePink opacity-40"></div>
            
            <div class="relative w-20 h-20 bg-gradient-to-tr from-livePurple to-livePink rounded-full mx-auto flex items-center justify-center text-2xl font-black border-4 border-cardBg shadow-lg mt-4">
                U
            </div>
            
            <div>
                <h2 class="text-lg font-bold">User Creator</h2>
                <p class="text-xs text-pink-400 font-medium">ID: 884920 • Let's Live Official</p>
            </div>

            <!-- Stats Row -->
            <div class="flex justify-around pt-3 border-t border-slate-800 text-center">
                <div>
                    <h4 class="font-extrabold text-sm">128</h4>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Following</span>
                </div>
                <div class="border-r border-slate-800"></div>
                <div>
                    <h4 class="font-extrabold text-sm">4.5K</h4>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Followers</span>
                </div>
                <div class="border-r border-slate-800"></div>
                <div>
                    <h4 class="font-extrabold text-sm">12.8K</h4>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Received</span>
                </div>
            </div>
        </div>

        <!-- Wallet & Diamonds Card -->
        <div class="bg-gradient-to-r from-purple-950/40 to-pink-950/40 border border-pink-500/30 p-5 rounded-2xl shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold tracking-wider text-pink-400">My Wallet</span>
                    <h3 class="text-2xl font-black flex items-center gap-1.5 mt-0.5">
                        <span>💎</span> 5,420 <span class="text-xs font-normal text-slate-400">Diamonds</span>
                    </h3>
                </div>
                <a href="wallet.html" class="bg-gradient-to-r from-livePurple to-livePink text-white text-xs font-bold px-4 py-2 rounded-xl shadow-lg hover:opacity-95 transition-all inline-block">
                    Recharge
                </a>
            </div>
        </div>

        <!-- Menu Options List -->
        <div class="bg-cardBg rounded-2xl border border-slate-800 divide-y divide-slate-800/60 overflow-hidden text-sm">
            <a href="wallet.html" class="flex items-center justify-between p-4 hover:bg-slate-800/40 transition-all">
                <span class="flex items-center gap-3"><span>💎</span> My Wallet & Payouts</span>
                <span class="text-slate-500">›</span>
            </a>
            <button onclick="alert('Account Settings: Profile details, security, and notification preferences are up to date.')" class="w-full flex items-center justify-between p-4 hover:bg-slate-800/40 transition-all text-left">
                <span class="flex items-center gap-3"><span>⚙️</span> Account Settings</span>
                <span class="text-slate-500">›</span>
            </button>
            <button onclick="alert('Help & Support: Contact our 24/7 moderation and technical assistance team via support@letslive.app')" class="w-full flex items-center justify-between p-4 hover:bg-slate-800/40 transition-all text-left">
                <span class="flex items-center gap-3"><span>🛡️</span> Help & Support</span>
                <span class="text-slate-500">›</span>
            </button>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-cardBg border-t border-slate-800 py-2 px-6 flex justify-between items-center z-50 text-xs">
        <a href="home.html" class="text-slate-400 hover:text-white flex flex-col items-center gap-0.5">
            <span>🏠</span> Home
        </a>
        <a href="home.html" class="text-slate-400 hover:text-white flex flex-col items-center gap-0.5">
            <span>🔍</span> Explore
        </a>
        <a href="room.html" class="text-slate-400 hover:text-white flex flex-col items-center gap-0.5">
            <span>💬</span> Messages
        </a>
        <a href="profile.html" class="text-livePink font-bold flex flex-col items-center gap-0.5">
            <span>👤</span> Profile
        </a>
    </nav>

</body>
</html>
