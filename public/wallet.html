<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Live - Wallet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        livePink: '#ff2a5f',
                        livePurple: '#7928ca',
                        darkBg: '#0f0f13',
                        cardBg: '#1a1a24'
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-[#0f0f13] min-h-screen text-slate-100 font-sans pb-24">

    <!-- Top Header -->
    <header class="bg-[#1a1a24] sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-md">
        <div class="flex items-center gap-2">
            <a href="home.html" class="text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <span class="text-base font-bold text-white">My Wallet</span>
        </div>
    </header>

    <!-- Main Wallet Content -->
    <div class="p-4 max-w-md mx-auto space-y-4">
        <div class="bg-gradient-to-r from-livePurple to-livePink p-6 rounded-2xl shadow-lg text-center space-y-2">
            <p class="text-xs text-pink-100 uppercase tracking-wider font-semibold">Available Balance</p>
            <h2 class="text-3xl font-black text-white">💎 2,500</h2>
            <p class="text-[11px] text-pink-200">Approx. $25.00 USD</p>
        </div>

        <div class="bg-[#1a1a24] p-4 rounded-2xl border border-slate-800 space-y-3">
            <h3 class="text-xs font-bold uppercase text-slate-400">Quick Actions</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="window.location.href='topup.html'" class="bg-gradient-to-r from-livePurple to-livePink text-white font-bold py-2.5 rounded-xl text-xs shadow hover:opacity-90 transition-all">Top Up</button>

                <button onclick="handleWithdraw()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition-all">Withdraw</button>
            </div>
            <!-- Status message container for action feedback -->
            <p id="wallet-status" class="text-xs text-center font-medium mt-2"></p>
        </div>
    </div>

    <!-- Universal Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1a1a24] border-t border-slate-800 py-2.5 px-6 flex justify-between items-center z-50 text-xs text-slate-400">
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>🏠</span> Home</a>
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>🔍</span> Explore</a>
        <a href="message.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>💬</span> Messages</a>
        <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>👤</span> Profile</a>
    </nav>

    <!-- Wallet Actions Script -->
    <script>
        function handleTopUp() {
            const statusEl = document.getElementById('wallet-status');
            statusEl.style.color = '#00ffcc';
            statusEl.innerText = "Top Up Gateway: Select package (1000 Diamonds = $9.99)";
        }

        function handleWithdraw() {
            const statusEl = document.getElementById('wallet-status');
            statusEl.style.color = '#ff4d4d';
            statusEl.innerText = "Minimum withdrawal balance required is 5,000 Diamonds.";
        }
    </script>
</body>
</html>
