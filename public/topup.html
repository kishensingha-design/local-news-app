<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Live - Top Up Diamonds</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        livePink: '#ff2a5f',
                        livePurple: '#7928ca',
                        darkBg: '#0f0f13',
                        cardBg: '#1a1a24'
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-[#0f0f13] min-h-screen text-slate-100 font-sans pb-24">

    <!-- Top Header -->
    <header class="bg-[#1a1a24] sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-md">
        <div class="flex items-center gap-3">
            <a href="wallet.html" class="text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <span class="text-base font-bold text-white">Select Top Up Package</span>
        </div>
    </header>

    <!-- Packages Container -->
    <div id="packages-view" class="p-4 max-w-md mx-auto space-y-3">
        <!-- Package 1 -->
        <button onclick="showPaymentGateway('1,000 Diamonds', '₹799', '$9.99')" class="w-full bg-[#1a1a24] border border-slate-800 hover:border-pink-500 p-4 rounded-2xl flex items-center justify-between transition-all text-left shadow">
            <div class="flex items-center gap-3">
                <span class="text-2xl">💎</span>
                <div>
                    <h4 class="text-sm font-bold text-white">1,000 Diamonds</h4>
                    <p class="text-[10px] text-slate-400">Starter Pack</p>
                </div>
            </div>
            <span class="bg-pink-500/10 text-pink-400 text-xs font-bold px-3 py-1.5 rounded-full border border-pink-500/20">₹799 ($9.99)</span>
        </button>

        <!-- Package 2 -->
        <button onclick="showPaymentGateway('5,000 Diamonds', '₹3,499', '$44.99')" class="w-full bg-[#1a1a24] border border-slate-800 hover:border-pink-500 p-4 rounded-2xl flex items-center justify-between transition-all text-left shadow">
            <div class="flex items-center gap-3">
                <span class="text-2xl">💎</span>
                <div>
                    <h4 class="text-sm font-bold text-white">5,000 Diamonds</h4>
                    <p class="text-[10px] text-slate-400">Popular Choice</p>
                </div>
            </div>
            <span class="bg-pink-500/10 text-pink-400 text-xs font-bold px-3 py-1.5 rounded-full border border-pink-500/20">₹3,499 ($44.99)</span>
        </button>

        <!-- Package 3 -->
        <button onclick="showPaymentGateway('10,000 Diamonds', '₹6,999', '$89.99')" class="w-full bg-[#1a1a24] border border-slate-800 hover:border-pink-500 p-4 rounded-2xl flex items-center justify-between transition-all text-left shadow">
            <div class="flex items-center gap-3">
                <span class="text-2xl">💎</span>
                <div>
                    <h4 class="text-sm font-bold text-white">10,000 Diamonds</h4>
                    <p class="text-[10px] text-slate-400">Pro Streamer Pack</p>
                </div>
            </div>
            <span class="bg-pink-500/10 text-pink-400 text-xs font-bold px-3 py-1.5 rounded-full border border-pink-500/20">₹6,999 ($89.99)</span>
        </button>
    </div>

    <!-- Payment Gateway Section (Hidden by default) -->
    <div id="gateway-view" class="p-4 max-w-md mx-auto space-y-4 hidden">
        <div class="bg-[#1a1a24] p-6 rounded-2xl border border-slate-800 text-center space-y-4 shadow-lg">
            <h3 id="gateway-title" class="text-sm font-bold text-white">Complete Payment</h3>
            <p id="gateway-amount" class="text-2xl font-black text-pink-400"></p>
            
            <!-- Simulated QR Code Box -->
            <div class="bg-white p-4 rounded-xl inline-block shadow-inner mx-auto w-40 h-40 flex flex-col items-center justify-center text-black">
                <span class="text-5xl">📱</span>
                <span class="text-[10px] font-bold mt-2">Scan & Pay via UPI</span>
            </div>

            <div class="space-y-2 text-left">
                <label class="block text-xs font-semibold uppercase text-slate-400">Or Pay via UPI ID / Number</label>
                <div class="bg-[#111117] p-3 rounded-lg border border-slate-700 text-xs text-slate-200 flex justify-between items-center">
                    <span>merchant@letsfivlive</span>
                    <span class="text-pink-400 font-bold text-[10px]">COPY</span>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="space-y-2 pt-2">
                <button onclick="verifyPayment()" class="w-full bg-gradient-to-r from-livePurple to-livePink text-white font-bold py-3 rounded-xl text-xs uppercase shadow hover:opacity-90 transition-all">I Have Paid - Verify</button>
                <button onclick="cancelGateway()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition-all">Cancel</button>
            </div>
        </div>
        <p id="verification-status" class="text-xs text-center font-medium text-pink-400"></p>
    </div>

    <!-- Universal Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1a1a24] border-t border-slate-800 py-2.5 px-6 flex justify-between items-center z-50 text-xs text-slate-400">
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>🏠</span> Home</a>
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>🔍</span> Explore</a>
        <a href="message.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>💬</span> Messages</a>
        <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>👤</span> Profile</a>
    </nav>

    <script>
        let selectedPackageName = "";

        function showPaymentGateway(packageName, inrPrice, usdPrice) {
            selectedPackageName = packageName;
            document.getElementById('packages-view').classList.add('hidden');
            document.getElementById('gateway-view').classList.remove('hidden');
            document.getElementById('gateway-title').innerText = `Purchase ${packageName}`;
            document.getElementById('gateway-amount').innerText = `${inrPrice} (${usdPrice})`;
        }

        function cancelGateway() {
            document.getElementById('gateway-view').classList.add('hidden');
            document.getElementById('packages-view').classList.remove('hidden');
            document.getElementById('verification-status').innerText = "";
        }

        function verifyPayment() {
            const status = document.getElementById('verification-status');
            status.innerText = "Verifying payment with UPI gateway...";
            setTimeout(() => {
                alert(`Payment successful! ${selectedPackageName} added to your wallet.`);
                window.location.href = 'wallet.html';
            }, 1500);
        }
    </script>
</body>
</html>
