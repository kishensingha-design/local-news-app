<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Live - Messages</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        livePink: '#ff2a5f',
                        livePurple: '#7928ca',
                        darkBg: '#0f0f13',
                        cardBg: '#1a1a24'
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-[#0f0f13] min-h-screen flex flex-col text-slate-100 font-sans pb-24">

    <!-- Top Header Bar -->
    <header class="bg-[#1a1a24] border-b border-slate-800 p-4 sticky top-0 z-10 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <a href="home.html" class="text-slate-400 hover:text-white transition-all">
                <!-- Back Arrow Icon -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-lg font-bold tracking-wide text-white">Messages</h1>
        </div>
        <span class="text-xs bg-livePink/20 text-livePink px-2.5 py-1 rounded-full font-semibold">3 New</span>
    </header>

    <!-- Message List Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-3">
        
        <!-- Chat Item 1 -->
        <a href="room.html" class="flex items-center gap-3 bg-[#1a1a24] border border-slate-800 hover:border-slate-700 p-3.5 rounded-2xl transition-all shadow-md">
            <div class="relative">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-livePurple to-livePink flex items-center text-white font-bold justify-center text-base">
                    JS
                </div>
                <!-- Online Indicator -->
                <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-cardBg rounded-full"></span>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-sm font-semibold text-white truncate">Kishen Singha</h2>
                    <span class="text-[10px] text-slate-400">10:42 AM</span>
                </div>
                <p class="text-xs text-slate-400 truncate">Hey! Are you ready for the live stream tonight?</p>
            </div>
            <span class="w-2 h-2 bg-livePink rounded-full"></span>
        </a>

        <!-- Chat Item 2 -->
        <a href="room.html" class="flex items-center gap-3 bg-[#1a1a24] border border-slate-800 hover:border-slate-700 p-3.5 rounded-2xl transition-all shadow-md">
            <div class="relative">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center text-white font-bold justify-center text-base">
                    AL
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-sm font-semibold text-white truncate">Anita Lawrence</h2>
                    <span class="text-[10px] text-slate-400">Yesterday</span>
                </div>
                <p class="text-xs text-slate-400 truncate">Thanks for the amazing gift during the broadcast!</p>
            </div>
        </a>

        <!-- Chat Item 3 -->
        <a href="room.html" class="flex items-center gap-3 bg-[#1a1a24] border border-slate-800 hover:border-slate-700 p-3.5 rounded-2xl transition-all shadow-md">
            <div class="relative">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-500 to-livePink flex items-center text-white font-bold justify-center text-base">
                    RM
                </div>
                <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-cardBg rounded-full"></span>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-sm font-semibold text-white truncate">Rahul Mehta</h2>
                    <span class="text-[10px] text-slate-400">Oct 4</span>
                </div>
                <p class="text-xs text-slate-400 truncate">Let's collaborate on the next dual-stream event.</p>
            </div>
        </a>

    </main>

    <!-- Universal Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1a1a24] border-t border-slate-800 py-2.5 px-6 flex justify-between items-center z-50 text-xs text-slate-400">
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>🏠</span> Home</a>
        <a href="home.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>🔍</span> Explore</a>
        <a href="message.html" class="text-pink-500 font-bold flex flex-col items-center gap-0.5"><span>💬</span> Messages</a>
        <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-pink-400 transition-all"><span>👤</span> Profile</a>
    </nav>

</body>
</html>
